<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">Rider ID card with documents verified</title>
  <rect width="600" height="400" rx="24" fill="#eaf1ff"/>
  <!-- documents behind -->
  <rect x="330" y="70" width="190" height="240" rx="12" fill="#fff" stroke="#bcd3f7" stroke-width="4" transform="rotate(8 425 190)"/>
  <g stroke="#bcd3f7" stroke-width="10" stroke-linecap="round" transform="rotate(8 425 190)">
    <line x1="360" y1="120" x2="490" y2="120"/><line x1="360" y1="150" x2="470" y2="150"/><line x1="360" y1="180" x2="490" y2="180"/><line x1="360" y1="210" x2="450" y2="210"/>
  </g>
  <!-- ID card -->
  <rect x="80" y="100" width="320" height="200" rx="18" fill="#fff" stroke="#0b3d91" stroke-width="6"/>
  <rect x="80" y="100" width="320" height="46" rx="18" fill="#0b3d91"/>
  <rect x="80" y="128" width="320" height="18" fill="#0b3d91"/>
  <text x="240" y="132" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">RIDER ID</text>
  <rect x="105" y="165" width="90" height="110" rx="10" fill="#eaf1ff"/>
  <circle cx="150" cy="205" r="22" fill="#c98b5f"/>
  <path d="M127 203 Q128 178 150 178 Q172 178 173 203 Z" fill="#ff7a00"/>
  <path d="M115 275 Q118 235 150 235 Q182 235 185 275 Z" fill="#12a76a"/>
  <g stroke="#9fb0d0" stroke-width="10" stroke-linecap="round">
    <line x1="220" y1="180" x2="370" y2="180"/><line x1="220" y1="210" x2="340" y2="210"/><line x1="220" y1="240" x2="360" y2="240"/>
  </g>
  <!-- verified badge -->
  <g transform="translate(400 290)">
    <circle r="52" fill="#12a76a" stroke="#fff" stroke-width="8"/>
    <path d="M-22 0 l15 15 l30 -32" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
