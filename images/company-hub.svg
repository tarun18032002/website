<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">Company delivery hub with a team of riders ready to start</title>
  <rect width="600" height="400" rx="24" fill="#f3f6fb"/>
  <rect y="320" width="600" height="80" fill="#dde3ee"/>
  <!-- warehouse -->
  <path d="M60 140 L230 60 L400 140 Z" fill="#0b3d91"/>
  <rect x="75" y="140" width="310" height="180" fill="#fff" stroke="#0b3d91" stroke-width="6"/>
  <rect x="160" y="100" width="140" height="34" rx="6" fill="#ff7a00"/>
  <text x="230" y="124" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">DELIVERY HUB</text>
  <!-- shutter door -->
  <rect x="160" y="190" width="140" height="130" fill="#9fb0d0"/>
  <g stroke="#7d8fb3" stroke-width="4"><line x1="160" y1="210" x2="300" y2="210"/><line x1="160" y1="230" x2="300" y2="230"/><line x1="160" y1="250" x2="300" y2="250"/></g>
  <!-- boxes -->
  <g fill="#d99a52" stroke="#a96d2c" stroke-width="3">
    <rect x="170" y="270" width="50" height="50"/><rect x="225" y="270" width="50" height="50"/><rect x="198" y="222" width="50" height="48"/>
  </g>
  <rect x="95" y="170" width="45" height="40" fill="#bcd3f7"/><rect x="320" y="170" width="45" height="40" fill="#bcd3f7"/>
  <!-- riders lined up -->
  <defs><g id="r">
    <circle cx="0" cy="0" r="18" fill="#c98b5f"/>
    <path d="M-19 -2 Q-18 -24 0 -24 Q18 -24 19 -2 Z" fill="#ff7a00"/>
    <path d="M-26 70 L-22 30 Q-20 18 0 18 Q20 18 22 30 L26 70 Z" fill="#12a76a"/>
    <rect x="-12" y="32" width="24" height="16" rx="3" fill="#fff"/>
    <rect x="-18" y="70" width="14" height="40" fill="#1a2233"/><rect x="4" y="70" width="14" height="40" fill="#1a2233"/>
  </g></defs>
  <use href="#r" x="440" y="215"/><use href="#r" x="495" y="215"/><use href="#r" x="550" y="215"/>
  <!-- clipboard -->
  <g transform="translate(470 60)">
    <rect width="90" height="110" rx="10" fill="#fff" stroke="#0b3d91" stroke-width="5"/>
    <rect x="28" y="-8" width="34" height="18" rx="5" fill="#0b3d91"/>
    <g stroke="#12a76a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 38 l8 8 l14 -16"/><path d="M16 70 l8 8 l14 -16"/>
    </g>
    <g stroke="#9fb0d0" stroke-width="6" stroke-linecap="round"><line x1="48" y1="38" x2="76" y2="38"/><line x1="48" y1="70" x2="76" y2="70"/></g>
  </g>
</svg>
